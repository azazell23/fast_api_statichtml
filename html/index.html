<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <h2>Simple Library App</h2>
    <form id="form">
      <label for="title">Title</label>
      <input id="title" name="title" type="text" required />

      <label for="author">Author</label>
      <input id="author" name="author" type="text" required />

      <label for="synopsis">Synopsis</label>
      <textarea id="synopsis" name="synopsis" required></textarea>

      <label for="price">Price</label>
      <input id="price" type="number" step="0.001" name="price" required />

      <label for="rating">Rating</label>
      <input id="rating" type="number" step="0.1" name="rating" required />

      <label for="cover-input">Cover</label>
      <input
        id="cover-input"
        name="cover"
        type="file"
        accept="image/jpeg, image/png"
      />

      <img id="preview" />

      <button type="submit">Add Book</button>
    </form>
    <div id="booklist"></div>

    <script src="../js//index.js"></script>
  </body>
</html>
